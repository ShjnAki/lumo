name: build-windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib
      - run: cargo build --release --bin lumo
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-windows
          path: target/release/lumo.exe
