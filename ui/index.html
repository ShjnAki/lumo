<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Lumo — Réglages</title>
<!--
  Fenêtre de réglages de Lumo, embarquée dans lumo.exe (include_str!) et affichée par WebView2.
  Aucune liste de réglages ici : les pages et les champs viennent de schema::to_json(),
  injecté par Rust dans window.LUMO_INIT avant le chargement.

  Page -> Rust : window.ipc.postMessage(JSON) avec { t: "set" | "action" | "browse" | "page" | "preview" | "ready" | "close", ... }
  Rust -> page : lumoRefresh(settings), lumoStatus(kind, text), lumoFrame(pngBase64)
-->
<style>
:root {
  --accent: #d6407f;
  --accent-soft: #ff66aa;
  --on-accent: #fff;
  --bg: #f7f6f9;
  --side: #efedf3;
  --card: #ffffff;
  --field: #fbfbfd;
  --hover: rgba(30, 20, 60, .055);
  --sel: rgba(30, 20, 60, .08);
  --line: rgba(30, 20, 60, .09);
  --line-strong: rgba(30, 20, 60, .17);
  --text: #1d1b24;
  --muted: #6d6a7a;
  --track: #dcd9e3;
  --knob: #fff;
  --ok: #1f9d63;
  --err: #d13438;
  --shadow: 0 1px 2px rgba(20, 10, 40, .06), 0 1px 1px rgba(20, 10, 40, .03);
  --pv-bg: #e9e7ef;
  --pv-line: rgba(30, 20, 60, .10);
  --pv-text: rgba(30, 20, 60, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #ff66aa;
    --accent-soft: #ff66aa;
    --on-accent: #1a0a12;
    --bg: #1c1b22;
    --side: #16151b;
    --card: #25242d;
    --field: #1f1e26;
    --hover: rgba(255, 255, 255, .05);
    --sel: rgba(255, 255, 255, .08);
    --line: rgba(255, 255, 255, .075);
    --line-strong: rgba(255, 255, 255, .15);
    --text: #ecebf1;
    --muted: #a19eb0;
    --track: #3d3b48;
    --knob: #f3f2f7;
    --ok: #4cc38a;
    --err: #ff6b6e;
    --shadow: none;
    --pv-bg: #2b2a34;
    --pv-line: rgba(255, 255, 255, .07);
    --pv-text: rgba(255, 255, 255, .12);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

/* ---------------------------------------------------------------- barre latérale */
.side {
  width: 216px;
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 18px 10px 12px;
  background: var(--side);
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 20px; }
.logo {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 21%, var(--accent-soft) 23% 100%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-soft) 22%, transparent), 0 2px 10px color-mix(in srgb, var(--accent-soft) 45%, transparent);
}
.brand b { display: block; font: 600 17px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: .2px; }
.brand small { color: var(--muted); font-size: 11.5px; }

nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item, .action {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 36px; padding: 0 10px;
  border: 0; border-radius: 7px;
  background: none; text-align: left;
}
.nav-item:hover, .action:hover { background: var(--hover); }
.nav-item.on { background: var(--sel); font-weight: 600; }
.nav-item.on::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 3px; background: var(--accent);
}
.nav-item svg, .action svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.nav-item.on svg { color: var(--accent); }
.nav-item .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); transition: background .2s; }
.nav-item .dot.lit { background: var(--accent-soft); box-shadow: 0 0 6px color-mix(in srgb, var(--accent-soft) 70%, transparent); }

.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; padding-top: 10px; border-top: 1px solid var(--line); }
.action { height: 32px; font-size: 12.5px; color: var(--muted); }
.action:hover { color: var(--text); }
.action svg { width: 16px; height: 16px; }

/* ---------------------------------------------------------------- contenu */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.head { display: flex; align-items: flex-start; gap: 20px; padding: 22px 30px 4px; }
.head .titles { flex: 1; min-width: 0; }
h1 { margin: 0; font: 600 25px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
.note { margin: 5px 0 0; max-width: 64ch; color: var(--muted); font-size: 12.5px; white-space: pre-line; user-select: text; }
.note:empty { display: none; }
.master { display: flex; align-items: center; gap: 10px; padding-top: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }

.scroll { flex: 1; overflow-y: auto; padding: 14px 30px 46px; }

.preview {
  position: relative;
  height: 128px; margin-bottom: 16px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 12px;
  background:
    linear-gradient(var(--pv-text), var(--pv-text)) 22px 26px / 34% 7px no-repeat,
    linear-gradient(var(--pv-text), var(--pv-text)) 22px 50px / 52% 7px no-repeat,
    linear-gradient(var(--pv-text), var(--pv-text)) 22px 74px / 44% 7px no-repeat,
    linear-gradient(var(--pv-text), var(--pv-text)) 22px 98px / 28% 7px no-repeat,
    repeating-linear-gradient(90deg, transparent 0 39px, var(--pv-line) 39px 40px),
    repeating-linear-gradient(0deg, transparent 0 39px, var(--pv-line) 39px 40px),
    var(--pv-bg);
}
.preview[hidden] { display: none; }
.preview img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.preview img:not([src]) { visibility: hidden; }
.preview .tag {
  position: absolute; right: 10px; top: 8px;
  padding: 2px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--card) 80%, transparent);
  color: var(--muted); font-size: 11px; letter-spacing: .3px;
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.row {
  display: flex; align-items: center; gap: 18px;
  min-height: 54px; padding: 9px 16px;
  border-top: 1px solid var(--line);
  transition: opacity .2s;
}
.row:first-child { border-top: 0; }
.row.stack { flex-direction: column; align-items: stretch; gap: 10px; padding: 13px 16px 14px; }
.row.muted { opacity: .45; }
.row.toggle { cursor: pointer; }
.lbl { flex: 1; min-width: 0; }
.ctl { flex: none; display: flex; align-items: center; gap: 8px; }

/* interrupteur */
.sw {
  position: relative; flex: none;
  width: 40px; height: 22px; padding: 0;
  border: 1px solid var(--line-strong); border-radius: 11px;
  background: var(--track);
  transition: background .15s, border-color .15s;
}
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--knob); box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .15s cubic-bezier(.3, .7, .4, 1.2), width .1s;
}
.sw:active::after { width: 17px; }
.sw[aria-checked="true"] { background: var(--accent); border-color: transparent; }
.sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.sw[aria-checked="true"]:active::after { transform: translateX(15px); }

/* curseur */
input[type="range"] {
  --p: 50%;
  width: 210px; height: 22px; margin: 0;
  background: transparent; -webkit-appearance: none; appearance: none;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent) var(--p), var(--track) var(--p));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
  background: var(--knob); border: 1px solid var(--line-strong);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25), inset 0 0 0 4px var(--accent);
  transition: box-shadow .1s;
}
input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 1px 3px rgba(0, 0, 0, .25), inset 0 0 0 3px var(--accent); }
input[type="range"]:active::-webkit-slider-thumb { box-shadow: 0 1px 3px rgba(0, 0, 0, .25), inset 0 0 0 5px var(--accent); }
input[type="range"].mini { width: 90px; }

/* champs */
.in {
  height: 32px; width: 250px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-bottom-color: color-mix(in srgb, var(--text) 35%, transparent);
  border-radius: 6px; background: var(--field);
  user-select: text; outline: none;
}
.in:focus { border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.in.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
.in.val { width: 74px; text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; }
.in.hex { width: 104px; }
.in.path { width: 230px; }
.in.listening {
  border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--field));
  animation: listen 1.1s ease-in-out infinite;
}
@keyframes listen { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); } }
.in::placeholder { color: var(--muted); opacity: .8; }

.btn {
  height: 32px; padding: 0 12px; flex: none;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--field); white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.icon-btn {
  width: 28px; height: 28px; padding: 0; flex: none;
  border: 0; border-radius: 6px; background: none; color: var(--muted);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn[hidden] { display: none; }

/* choix */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 30px; padding: 0 13px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--field);
  transition: background .12s, color .12s;
}
.chip:hover { background: var(--hover); }
.chip.on { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }

/* couleur */
.swatch {
  position: relative; width: 44px; height: 30px; flex: none;
  border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden;
  background: conic-gradient(#ccc 25%, #fff 0 50%, #ccc 0 75%, #fff 0) 0 0 / 10px 10px;
  background-clip: padding-box;
  cursor: pointer;
}
.swatch::after { content: ""; position: absolute; inset: 0; background: var(--c, #000); }
.swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.alpha-val { width: 38px; color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

/* ligne d'état */
.status {
  position: absolute; right: 24px; bottom: 12px;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 12px; color: var(--ok);
  opacity: 0; transform: translateY(4px);
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}
.status.show { opacity: 1; transform: none; }
.status.err { color: var(--err); }
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo"></span><div><b>Lumo</b><small id="version"></small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot" id="actions"></div>
</aside>
<main>
  <header class="head">
    <div class="titles"><h1 id="title"></h1><p class="note" id="note"></p></div>
    <div class="master" id="master"></div>
  </header>
  <div class="scroll" id="scroll">
    <section class="preview" id="preview" hidden><img id="frame" alt=""><span class="tag" id="ptag"></span></section>
    <section class="card" id="fields"></section>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script>
"use strict";

// Textes de l'interface (les libellés des réglages viennent du schéma). Ajouter une langue = une clé.
const STR = {
  fr: {
    preview: "Aperçu",
    previewOff: "Aperçu · effets désactivés",
    saved: "Enregistré",
    on: "Activé",
    off: "Désactivé",
    detect: "Détecter",
    detecting: "Appuyez…",
    holdPrompt: "Maintenez, puis relâchez",
    hotkeyPrompt: "Tapez la combinaison",
    needMod: "Ajoutez un modificateur : Ctrl, Alt, Shift ou Win",
    badKey: "Touche non prise en charge : lettres, chiffres, F1-F24, Ctrl, Alt, Shift, Win, CapsLock",
    fnHint: "La touche Fn est invisible pour Windows : remappez-la vers F13 dans le logiciel du clavier",
    none: "Aucun",
    clear: "Effacer",
    browse: "Parcourir…",
    empty: "Vide",
    opacity: "Opacité",
    actions: {
      clear_annotations: "Effacer les annotations",
      restore_cursors: "Restaurer les curseurs",
      open_json: "Ouvrir settings.json",
    },
  },
};
const T = STR.fr;

const ICONS = {
  general: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  spotlight: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  ring: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>',
  trail: '<path d="M3 17c3 0 4-8 8-8s4 6 7 6"/><circle cx="20" cy="15" r="1.6"/><circle cx="5" cy="7" r="1" /><circle cx="8.5" cy="4.8" r=".8"/>',
  click: '<path d="M9 9l11 4-5 2-2 5z"/><path d="M5.5 5.5 4 4M9 3.5V2M3.5 9H2M13 4.5 14 3.5"/>',
  annotate: '<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  cursor: '<path d="M6 3l12 7-5.5 1.5L10 17z"/><path d="M13 12l4.5 6"/>',
  hotkeys: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  clear_annotations: '<path d="M4 20h16M7 16 17 6l-3-3L4 13l3 3h5"/>',
  restore_cursors: '<path d="M4 12a8 8 0 1 0 3-6.3"/><path d="M4 4v5h5"/>',
  open_json: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  fallback: '<circle cx="12" cy="12" r="8"/>',
};
const icon = name =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.fallback}</svg>`;

// ---------------------------------------------------------------- état et échanges
const INIT = window.LUMO_INIT || { schema: [], settings: {}, page: "", version: "" };
const PAGES = INIT.schema;
let S = INIT.settings;
let cur = Math.max(0, PAGES.findIndex(p => p.id === INIT.page));
let binds = [];

const post = msg => { try { window.ipc.postMessage(JSON.stringify(msg)); } catch (e) { console.error(e); } };
const get = (o, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
const put = (o, path, v) => {
  const ks = path.split("."), last = ks.pop();
  const parent = ks.reduce((a, k) => (a[k] ??= {}), o);
  parent[last] = v;
};
const $ = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};

// envoi groupé par image : un curseur qu'on fait glisser n'envoie qu'une valeur par trame
const pending = new Map();
let flushQueued = false;
function send(path, value, now) {
  put(S, path, value);
  pending.set(path, value);
  if (now) return flush();
  if (!flushQueued) { flushQueued = true; requestAnimationFrame(flush); }
}
function flush() {
  flushQueued = false;
  for (const [path, value] of pending) post({ t: "set", path, value });
  pending.clear();
  updateDeps();
}

// ---------------------------------------------------------------- mise en forme des nombres
const decimals = step => (step >= 1 ? 0 : step >= 0.1 ? 1 : 2);
function fmt(f, v) {
  if (f.pct) return `${Math.round(v * 100)} %`;
  return v.toFixed(decimals(f.step)).replace(".", ",") + f.unit;
}
function parseNum(f, text) {
  const n = parseFloat(String(text).replace(",", ".").replace(/[^\d.+-]/g, ""));
  if (!isFinite(n)) return null;
  const v = f.pct ? n / 100 : n;
  const snapped = Math.round((Math.min(f.max, Math.max(f.min, v)) - f.min) / f.step) * f.step + f.min;
  return Math.round(snapped * 10000) / 10000;
}

// ---------------------------------------------------------------- couleurs
const hexParts = hex => {
  const h = String(hex || "").replace("#", "");
  return { rgb: "#" + (h.slice(0, 6) || "000000"), a: h.length === 8 ? parseInt(h.slice(6, 8), 16) : 255 };
};
const withAlpha = (rgb, a) => (a >= 255 ? rgb : rgb + Math.round(a).toString(16).padStart(2, "0")).toLowerCase();
const cssColor = hex => {
  const { rgb, a } = hexParts(hex);
  const n = parseInt(rgb.slice(1), 16);
  return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${(a / 255).toFixed(3)})`;
};

// ---------------------------------------------------------------- noms de touches (acceptés par settings::parse_hold / parse_hotkey)
const HOLD_NAMES = {
  ControlLeft: "Ctrl", ControlRight: "RCtrl", AltLeft: "Alt", AltRight: "RAlt",
  ShiftLeft: "Shift", ShiftRight: "RShift", MetaLeft: "Win", MetaRight: "RWin", CapsLock: "CapsLock",
};
const ORDER = ["Ctrl", "RCtrl", "Alt", "RAlt", "Shift", "RShift", "Win", "RWin", "CapsLock"];
function mainKeyName(code) {
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1];
  if ((m = /^Digit(\d)$/.exec(code))) return m[1];
  if ((m = /^F(\d{1,2})$/.exec(code)) && +m[1] >= 1 && +m[1] <= 24) return "F" + m[1];
  return null;
}
const holdName = code => HOLD_NAMES[code] || mainKeyName(code);
const isModifier = code => /^(Control|Alt|Shift|Meta)(Left|Right)$/.test(code);
function hotkeyName(e) {
  const main = mainKeyName(e.code);
  const mods = [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Win"].filter(Boolean);
  return { main, mods, text: [...mods, main].filter(Boolean).join("+") };
}

// ---------------------------------------------------------------- détection de touches
let capture = null; // { kind: "hold"|"hotkey", input, button, done(value|null), keys: [] }

function startCapture(kind, input, button, done) {
  stopCapture(null);
  capture = { kind, input, button, done, keys: [], before: input.value };
  input.value = "";
  input.placeholder = kind === "hold" ? T.holdPrompt : T.hotkeyPrompt;
  input.classList.add("listening");
  button.textContent = T.detecting;
  button.classList.add("primary");
  input.focus();
}
function stopCapture(value) {
  if (!capture) return;
  const c = capture;
  capture = null;
  c.input.classList.remove("listening");
  c.input.placeholder = c.kind === "hotkey" ? T.none : "";
  c.button.textContent = T.detect;
  c.button.classList.remove("primary");
  c.input.value = value ?? c.before;
  if (value != null) c.done(value);
}
function onCaptureKey(e) {
  if (!capture) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.repeat) return;
  const c = capture;
  if (e.type === "keydown" && e.code === "Escape" && !c.keys.length) return stopCapture(null);
  if (c.kind === "hotkey") {
    if (e.type !== "keydown") return;
    if (!e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && (e.code === "Backspace" || e.code === "Delete")) {
      return stopCapture("");
    }
    const k = hotkeyName(e);
    if (isModifier(e.code)) { c.input.value = k.mods.join("+") + "+…"; return; }
    if (!k.main) return status(e.key === "Unidentified" ? T.fnHint : T.badKey, true);
    if (!k.mods.length) return status(T.needMod, true);
    return stopCapture(k.text);
  }
  // touches maintenues : on accumule à l'appui, on valide au premier relâchement
  if (e.type === "keydown") {
    const name = holdName(e.code);
    if (!name) return status(e.key === "Unidentified" ? T.fnHint : T.badKey, true);
    if (!c.keys.includes(name)) c.keys.push(name);
    c.keys.sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
    c.input.value = c.keys.join("+");
  } else if (c.keys.length) {
    stopCapture(c.keys.join("+"));
  }
}
addEventListener("keydown", onCaptureKey, true);
addEventListener("keyup", onCaptureKey, true);
addEventListener("blur", () => stopCapture(null));

// ---------------------------------------------------------------- contrôles
function row(f, cls) {
  const r = $("div", "row" + (cls ? " " + cls : ""));
  r.dataset.path = f.path;
  const l = $("div", "lbl");
  l.textContent = f.label;
  r.append(l);
  return r;
}

function switchEl(f) {
  const b = $("button", "sw");
  b.setAttribute("role", "switch");
  b.setAttribute("aria-label", f.label);
  const set = v => b.setAttribute("aria-checked", String(!!v));
  b.addEventListener("click", e => {
    e.stopPropagation();
    const v = b.getAttribute("aria-checked") !== "true";
    set(v);
    send(f.path, v, true);
  });
  return { el: b, set };
}

const BUILD = {
  bool(f) {
    const r = row(f, "toggle");
    const sw = switchEl(f);
    r.append(sw.el);
    r.addEventListener("click", () => sw.el.click());
    return { root: r, set: sw.set };
  },

  select(f) {
    const r = row(f, "stack");
    const box = $("div", "chips");
    box.setAttribute("role", "radiogroup");
    const btns = f.options.map(o => {
      const b = $("button", "chip");
      b.textContent = o.label;
      b.setAttribute("role", "radio");
      b.addEventListener("click", () => { set(o.value); send(f.path, o.value, true); });
      box.append(b);
      return b;
    });
    const set = v => btns.forEach((b, i) => {
      const on = f.options[i].value === v;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", String(on));
    });
    r.append(box);
    return { root: r, set };
  },

  num(f) {
    const r = row(f);
    const c = $("div", "ctl");
    const range = $("input");
    range.type = "range";
    range.min = 0;
    range.max = Math.round((f.max - f.min) / f.step);
    range.step = 1;
    range.setAttribute("aria-label", f.label);
    const val = $("input", "in val");
    val.spellcheck = false;
    let dragging = false;
    const paint = v => {
      const pos = Math.round((v - f.min) / f.step);
      range.value = pos;
      range.style.setProperty("--p", (pos / range.max) * 100 + "%");
    };
    const set = v => {
      if (!dragging) paint(v);
      if (document.activeElement !== val) val.value = fmt(f, v);
    };
    range.addEventListener("pointerdown", () => (dragging = true));
    addEventListener("pointerup", () => (dragging = false));
    range.addEventListener("input", () => {
      const v = Math.round((f.min + range.value * f.step) * 10000) / 10000;
      range.style.setProperty("--p", (range.value / range.max) * 100 + "%");
      val.value = fmt(f, v);
      send(f.path, v);
    });
    range.addEventListener("change", () => flush());
    const commit = () => {
      const v = parseNum(f, val.value);
      if (v == null) { val.value = fmt(f, get(S, f.path)); return; }
      paint(v);
      val.value = fmt(f, v);
      send(f.path, v, true);
    };
    val.addEventListener("change", commit);
    val.addEventListener("keydown", e => { if (e.key === "Enter") { commit(); val.blur(); } });
    val.addEventListener("focus", () => val.select());
    c.append(range, val);
    r.append(c);
    return { root: r, set };
  },

  color(f) {
    const r = row(f);
    const c = $("div", "ctl");
    const sw = $("label", "swatch");
    const picker = $("input");
    picker.type = "color";
    picker.setAttribute("aria-label", f.label);
    sw.append(picker);
    const hex = $("input", "in mono hex");
    hex.spellcheck = false;
    const alpha = $("input", "mini");
    alpha.type = "range";
    alpha.min = 0;
    alpha.max = 255;
    alpha.title = T.opacity;
    alpha.setAttribute("aria-label", `${f.label} — ${T.opacity}`);
    const aval = $("span", "alpha-val");
    let dragging = false;
    const show = v => {
      const { rgb, a } = hexParts(v);
      sw.style.setProperty("--c", cssColor(v));
      if (document.activeElement !== picker) picker.value = rgb;
      if (document.activeElement !== hex) hex.value = v;
      if (!dragging) alpha.value = a;
      alpha.style.setProperty("--p", (a / 255) * 100 + "%");
      aval.textContent = Math.round((a / 255) * 100) + " %";
    };
    const change = (v, now) => { show(v); send(f.path, v, now); };
    picker.addEventListener("input", () => change(withAlpha(picker.value, +alpha.value)));
    picker.addEventListener("change", () => flush());
    alpha.addEventListener("pointerdown", () => (dragging = true));
    addEventListener("pointerup", () => (dragging = false));
    alpha.addEventListener("input", () => change(withAlpha(hexParts(get(S, f.path)).rgb, +alpha.value)));
    alpha.addEventListener("change", () => flush());
    const commitHex = () => {
      let v = hex.value.trim().toLowerCase();
      if (!v.startsWith("#")) v = "#" + v;
      if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/.test(v)) change(v, true);
      else hex.value = get(S, f.path);
    };
    hex.addEventListener("change", commitHex);
    hex.addEventListener("keydown", e => { if (e.key === "Enter") { commitHex(); hex.blur(); } });
    c.append(sw, hex, alpha, aval);
    r.append(c);
    return { root: r, set: show };
  },

  text(f, opts = {}) {
    const r = row(f);
    const c = $("div", "ctl");
    const input = $("input", "in" + (opts.cls ? " " + opts.cls : ""));
    input.spellcheck = false;
    input.setAttribute("aria-label", f.label);
    if (opts.placeholder) input.placeholder = opts.placeholder;
    const commit = () => send(f.path, input.value.trim(), true);
    input.addEventListener("change", commit);
    input.addEventListener("keydown", e => { if (e.key === "Enter" && !capture) input.blur(); });
    c.append(input);
    let clear;
    if (opts.clearable) {
      clear = $("button", "icon-btn", icon("x"));
      clear.title = T.clear;
      clear.addEventListener("click", () => { input.value = ""; commit(); clear.hidden = true; });
      c.append(clear);
    }
    r.append(c);
    const set = v => {
      if (document.activeElement !== input && !(capture && capture.input === input)) input.value = v ?? "";
      if (clear) clear.hidden = !v;
    };
    return { root: r, set, c, input };
  },

  hotkey(f) { return keyField(f, "hotkey"); },
  hold(f) { return keyField(f, "hold"); },

  file(f) { return pathField(f); },
  folder(f) { return pathField(f); },
};

function keyField(f, kind) {
  const b = BUILD.text(f, { cls: "mono", placeholder: kind === "hotkey" ? T.none : "", clearable: kind === "hotkey" });
  const btn = $("button", "btn");
  btn.textContent = T.detect;
  btn.addEventListener("click", () => {
    if (capture && capture.input === b.input) return stopCapture(null);
    startCapture(kind, b.input, btn, v => send(f.path, v, true));
  });
  b.c.insertBefore(btn, b.input.nextSibling);
  return b;
}

function pathField(f) {
  const b = BUILD.text(f, { cls: "path", placeholder: T.empty, clearable: true });
  const btn = $("button", "btn");
  btn.textContent = T.browse;
  btn.addEventListener("click", () => post({ t: "browse", path: f.path }));
  b.c.insertBefore(btn, b.input.nextSibling);
  return b;
}

// ---------------------------------------------------------------- pages
const nav = document.getElementById("nav");
const navItems = PAGES.map((p, i) => {
  const b = $("button", "nav-item", `${icon(p.id)}<span>${p.title}</span><span class="dot"></span>`);
  b.addEventListener("click", () => show(i));
  nav.append(b);
  return b;
});
nav.addEventListener("keydown", e => {
  const d = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
  if (!d) return;
  e.preventDefault();
  show((cur + d + PAGES.length) % PAGES.length);
  navItems[cur].focus();
});

const actions = document.getElementById("actions");
for (const [name, label] of Object.entries(T.actions)) {
  const b = $("button", "action", `${icon(name)}<span>${label}</span>`);
  b.addEventListener("click", () => post({ t: "action", name }));
  actions.append(b);
}
document.getElementById("version").textContent = INIT.version ? "v" + INIT.version : "";

// interrupteur principal : le premier champ de la page, s'il active toute la page (« ring.enabled »)
const masterOf = p => {
  const f = p.fields[0];
  return f && f.type === "bool" && (f.path === "enabled" || f.path.endsWith(".enabled")) && p.fields.length > 1 ? f : null;
};
// « ring.color » dépend de « ring.enabled », « shake_to_locate » de « enabled »
const depOf = path => { const i = path.lastIndexOf("."); return i < 0 ? "enabled" : path.slice(0, i) + ".enabled"; };

function updateDeps() {
  const page = PAGES[cur];
  const paths = new Set(page.fields.map(f => f.path));
  for (const r of document.querySelectorAll(".row[data-path]")) {
    const dep = depOf(r.dataset.path);
    r.classList.toggle("muted", dep !== r.dataset.path && paths.has(dep) && get(S, dep) === false);
  }
  PAGES.forEach((p, i) => {
    const m = masterOf(p);
    const dot = navItems[i].querySelector(".dot");
    dot.style.visibility = m ? "visible" : "hidden";
    dot.classList.toggle("lit", !!m && get(S, m.path) === true && S.enabled !== false);
  });
  document.getElementById("ptag").textContent = S.enabled === false ? T.previewOff : T.preview;
}

const preview = document.getElementById("preview");
const frame = document.getElementById("frame");
function sendPreviewSize() {
  const p = PAGES[cur];
  if (!p || !p.preview) return post({ t: "preview", page: p ? p.id : "", w: 0, h: 0 });
  const r = preview.getBoundingClientRect(), k = devicePixelRatio || 1;
  post({ t: "preview", page: p.id, w: Math.round(r.width * k), h: Math.round(r.height * k) });
}
new ResizeObserver(sendPreviewSize).observe(preview);

function show(i) {
  stopCapture(null);
  cur = i;
  const p = PAGES[i];
  navItems.forEach((b, j) => {
    b.classList.toggle("on", j === i);
    if (j === i) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  document.getElementById("title").textContent = p.title;
  document.getElementById("note").textContent = p.note;

  const master = document.getElementById("master");
  const fields = document.getElementById("fields");
  master.replaceChildren();
  fields.replaceChildren();
  binds = [];
  const masterField = masterOf(p);
  for (const f of p.fields) {
    if (f === masterField) {
      const label = $("span");
      const sw = switchEl(f);
      master.append(label, sw.el);
      binds.push({ path: f.path, set: v => { sw.set(v); label.textContent = v ? T.on : T.off; } });
      continue;
    }
    const b = (BUILD[f.type] || BUILD.text)(f);
    fields.append(b.root);
    binds.push({ path: f.path, set: b.set });
  }
  fields.hidden = !fields.children.length;
  for (const b of binds) b.set(get(S, b.path));
  updateDeps();

  preview.hidden = !p.preview;
  frame.removeAttribute("src");
  document.getElementById("scroll").scrollTop = 0;
  post({ t: "page", id: p.id });
  sendPreviewSize();
}

// ---------------------------------------------------------------- appelé par Rust
let statusTimer = 0;
function status(text, err) {
  const s = document.getElementById("status");
  s.textContent = (err ? "" : "✓ ") + text;
  s.classList.toggle("err", !!err);
  s.classList.add("show");
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => s.classList.remove("show"), err ? 4500 : 1600);
}
window.lumoStatus = (kind, text) => status(text || T.saved, kind === "error");
window.lumoRefresh = settings => {
  // les valeurs pas encore envoyées gardent la main
  for (const [path, value] of pending) put(settings, path, value);
  S = settings;
  for (const b of binds) b.set(get(S, b.path));
  updateDeps();
};
window.lumoFrame = b64 => { frame.src = "data:image/png;base64," + b64; };

// ---------------------------------------------------------------- clavier global
addEventListener("keydown", e => {
  if (e.key === "Escape" && !capture) {
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && a.type !== "range") return a.blur();
    post({ t: "close" });
  }
});
addEventListener("contextmenu", e => {
  if (!(e.target instanceof HTMLInputElement)) e.preventDefault();
});
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => e.preventDefault());

show(cur);
requestAnimationFrame(() => post({ t: "ready" }));
</script>
