[package]
name = "lumo"
version = "0.1.0"
edition = "2021"
description = "Cursor highlighter for Windows: spotlight, ring, trail, click effects, osu-style cursor"

[dependencies]
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Dwm",
] }
# Fenêtre de réglages : WebView2 (préinstallé sur Windows 11), page HTML embarquée dans l'exe.
wry = { version = "0.57", default-features = false }
# Boîtes « Parcourir » modernes (IFileOpenDialog) ; même version que celle utilisée par wry.
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
